name: Verify Ephemeral ARC Runner

on:
  push:
    branches:
      - feat/ci-cd-implementation
  workflow_dispatch:

jobs:
  verify-cluster-access:
    runs-on: mk8s-org-runner
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Verify Docker-in-Docker sidecar
        run: |
          echo "Checking isolated Docker daemon..."
          docker version

      - name: Verify native MicroK8s API access via ServiceAccount
        run: |
          echo "Running as user: $(whoami) inside ephemeral pod: $(hostname)"
          which kubectl
          kubectl get namespaces
          kubectl get pods -A