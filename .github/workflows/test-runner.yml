name: Test Direct Local Runner

on:
  push:
    branches:
      - feat/ci-cd-implementation
  workflow_dispatch:

jobs:
  deploy-job:
    runs-on: [self-hosted, mk8s]
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Verify kubectl access on MicroK8s
        run: |
          echo "Running as user: $(whoami) on host: $(hostname)"
          which kubectl
          kubectl get namespaces
          kubectl get pods -A