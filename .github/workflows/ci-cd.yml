name: Build, Secure and Deploy Percona Digest CronJob

on:
  push:
    branches:
      - main
      - staging
      - feat/ci-cd-implementation
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: mk8s-org-runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set target environment and image tag based on branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_NS=vf-prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TARGET_NS=vf-staging" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=staging" >> $GITHUB_OUTPUT
          fi

          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Kubernetes Secret from GitHub Secrets
        run: |
          mkdir -p secrets
          echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" > secrets/credentials.json

          kubectl create secret generic percona-gdrive-secret \
            --namespace=${{ steps.vars.outputs.TARGET_NS }} \
            --from-file=credentials.json=secrets/credentials.json \
            --dry-run=client -o yaml | kubectl apply -f -
            
          rm -rf secrets/

      - name: Obfuscate Python code with PyArmor
        run: |
          pip install --quiet pyarmor
          # Replace 'main.py' and 'mysql_perf_metrics/' with your exact script names/directories
          pyarmor gen --output dist main.py mysql_perf_metrics/
          cp -r dist/* .
          rm -rf dist

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.vars.outputs.IMAGE_ID }}:${{ steps.vars.outputs.IMAGE_TAG }} .
          docker push ${{ steps.vars.outputs.IMAGE_ID }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Deploy CronJob to MicroK8s
        run: |
          sed "s|IMAGE_TAG_PLACEHOLDER|${{ steps.vars.outputs.IMAGE_ID }}:${{ steps.vars.outputs.IMAGE_TAG }}|g" k8s/cronjob.yaml | \
          kubectl apply -n ${{ steps.vars.outputs.TARGET_NS }} -f -