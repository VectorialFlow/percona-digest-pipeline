apiVersion: batch/v1
kind: CronJob
metadata:
  name: percona-digest-job
  labels:
    app: percona-digest-pipeline
spec:
  schedule: "1 0 * * 5"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: percona-digest-pipeline
        spec:
          restartPolicy: Never
          containers:
            - name: percona-analyzer
              image: localhost:32000/percona-digest-pipeline:IMAGE_TAG_PLACEHOLDER
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: "/app/secrets/credentials.json"
              volumeMounts:
                - name: gdrive-secret-volume
                  mountPath: /app/secrets
                  readOnly: true
          volumes:
            - name: gdrive-secret-volume
              secret:
                secretName: percona-gdrive-secret